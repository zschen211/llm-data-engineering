[project]
name = "mm-rag"
version = "0.1.0"
description = "Multimodal RAG assistant for financial reports: PDF pages -> visual index -> Top-K retrieval -> evidence-based answers."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
]

[project.scripts]
mm-rag = "mm_rag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
gpu = [
    "torch",
    "transformers",
    "byaldi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
