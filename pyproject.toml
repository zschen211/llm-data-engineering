[project]
name = "llm-data-engineering"
version = "0.1.0"
description = "LLM data engineering pipeline with Airflow"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=2.9.0",
    "warcio>=1.8.1",
]

[project.scripts]
airflow-standalone = "cli.airflow_standalone:main"
warc-inspector = "cli.warc_inspector:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cli --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
