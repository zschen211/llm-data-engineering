[project]
name = "video-generation"
version = "0.1.0"
description = "T2V video generation data pipeline: source load, scene detection, motion/aesthetic filtering, multi-frame captioning and shot-language tagging."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.9",
]

[project.scripts]
video-generation = "video_generation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
gpu = [
    "torch",
    "transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_generation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
