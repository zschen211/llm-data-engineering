[project]
name = "data-factory"
version = "0.1.0"
description = "Data production & eval closed loop over the llava-instruct asset layer: strategies, workflows, lineage, model registry, eval and reports."
requires-python = ">=3.11"
dependencies = [
    "llava-instruct",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pyarrow>=16.0.0",
    "ray[data,default]>=2.9",
    "tqdm>=4.60.0",
]

[tool.uv.sources]
llava-instruct = { path = "../llava-instruct" }

[project.scripts]
dfac = "data_factory.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.0",
    "bandit>=1.7.0",
    "pylint>=3.0.0",
    "radon>=6.0.0",
    "ruff>=0.9.0",
]
gpu = [
    "torch",
    "transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001: blind `except Exception` is a deliberate pattern here (per-row
# pipeline failure isolation, per-file import errors); approved project-wide.
ignore = ["BLE001"]

[tool.pylint]
fail-under = 8

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "line-too-long", # ruff owns line-length policy
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring", # docstrings only where design intent (AGENTS.md)
    "duplicate-code",
    "invalid-name",
    "no-member", # composition-facade mixins: services/* reference DataFactory state
    "redefined-builtin", # API params deliberately named type/file/input
    "unused-argument", # pytest fixtures + interface stubs
    "redefined-outer-name", # pytest fixture arg shadowing
    "protected-access", # tests poke internals deliberately
    "disallowed-name", # tests use foo/bar
    "broad-exception-caught", # deliberate blind-catch pattern (ruff BLE001 approved)
    "too-many-ancestors", # DataFactory composition facade
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-nested-blocks",
    "too-many-return-statements",
    "import-error", # gpu-extra guard imports (torch/transformers) not installed in dev
    "import-outside-toplevel", # gpu-extra guard imports: documented exception (AGENTS.md)
]
