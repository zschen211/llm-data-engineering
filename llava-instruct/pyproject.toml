[project]
name = "llava-instruct"
version = "0.1.0"
description = "LLaVA multimodal instruction data factory: assets -> supervision -> QA -> training delivery."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
]

[project.scripts]
llava-instruct = "llava_instruct.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
rustfs = [
    "boto3>=1.34.0",
]
hf = [
    "huggingface_hub>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llava_instruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
