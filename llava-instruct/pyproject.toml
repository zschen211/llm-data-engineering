[project]
name = "llava-instruct"
version = "0.1.0"
description = "LLaVA multimodal instruction data factory: assets -> supervision -> QA -> training delivery."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
]

[project.scripts]
llava-instruct = "llava_instruct.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llava_instruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
