[project]
name = "llava-instruct"
version = "0.1.0"
description = "LLaVA multimodal instruction data factory: assets -> supervision -> QA -> training delivery."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "huggingface_hub>=0.23.0",
    "pillow>=10.0.0",
    "prometheus-client>=0.21.0",
    "psutil>=5.9.0",
    "pyarrow>=16.0.0",
    "ray[default]>=2.9",
    "tqdm>=4.60.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.0",
    "httpx>=0.27.0",
    "bandit>=1.7.0",
    "pylint>=3.0.0",
    "radon>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llava_instruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001: blind `except Exception` is a deliberate pattern here (download
# retry, per-file error collection, background-thread fallback); approved
# project-wide on 2026-08-10.
ignore = ["BLE001"]

[tool.pylint]
fail-under = 8

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "line-too-long", # ruff owns line-length policy
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring", # docstrings only where design intent (AGENTS.md)
    "duplicate-code",
    "invalid-name", # module-level mutable singletons (log.py)
    "global-statement", # log.py listener singleton
    "no-member", # composition-facade mixins: services/* reference AssetStore state
    "redefined-builtin", # API params deliberately named type/license
    "unused-argument", # pytest fixtures + interface stubs
    "redefined-outer-name", # pytest fixture arg shadowing
    "protected-access", # tests poke internals deliberately
    "disallowed-name", # tests use foo/bar
    "broad-exception-caught", # deliberate blind-catch pattern (ruff BLE001 approved)
    "too-many-ancestors", # AssetStore composition facade
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-nested-blocks",
    "too-many-return-statements",
]
