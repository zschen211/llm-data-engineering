[project]
name = "llava-instruct"
version = "0.1.0"
description = "LLaVA multimodal instruction data factory: assets -> supervision -> QA -> training delivery."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "huggingface_hub>=0.23.0",
    "pillow>=10.0.0",
    "pyarrow>=16.0.0",
    "ray>=2.9",
    "tqdm>=4.60.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llava_instruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001: blind `except Exception` is a deliberate pattern here (download
# retry, per-file error collection, background-thread fallback); approved
# project-wide on 2026-08-10.
ignore = ["BLE001"]
