<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据资产管理 - llava-instruct</title>
<style>
:root{
  --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff; --blue-border:#bfdbfe;
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --ok:#16a34a; --ok-bg:#f0fdf4; --err:#dc2626; --err-bg:#fef2f2; --warn:#d97706;
  --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08);
  --sidebar-w:210px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff}
.brand h1{font-size:16px;font-weight:600}
.brand p{font-size:11px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
button{cursor:pointer;border-radius:7px;border:1px solid transparent;font-size:13px;padding:6px 12px;transition:.15s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-dark)}
.btn-g{background:#fff;border-color:var(--border);color:var(--text)}
.btn-g:hover{border-color:var(--blue);color:var(--blue)}
.btn-d{background:#fff;border-color:var(--border);color:var(--err);font-size:12px;padding:3px 8px}
.btn-d:hover{background:var(--err-bg);border-color:#fecaca}
.btn-w{background:#fffbeb;border-color:#f59e0b;color:#b45309}
.btn-w:hover{background:#fef3c7}
.btn-s{font-size:12px;padding:3px 9px}
.layout{display:flex;min-height:calc(100vh - 55px)}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:55px;height:calc(100vh - 55px)}
.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text);font-size:13.5px}
.nav-item svg{flex-shrink:0;color:var(--muted)}
.nav-item:hover{background:var(--blue-light)}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item.active svg{color:#fff}
.nav-item .badge-count{margin-left:auto;font-size:11px;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:1px 8px}
.nav-item.active .badge-count{background:rgba(255,255,255,.22);color:#fff}
.sidebar-foot{padding:10px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);word-break:break-all}
.sidebar-foot .chip{display:inline-block;background:var(--blue-light);border:1px solid var(--blue-border);color:var(--blue-dark);border-radius:999px;padding:2px 10px;margin-top:6px}
.content{flex:1;padding:22px 26px 60px;min-width:0}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.card-head h2{font-size:15px;font-weight:600}
.card-head .hint{font-size:12px;color:var(--muted)}
.card-body{padding:15px 18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.b-t{background:var(--blue-light);color:var(--blue-dark);border:1px solid var(--blue-border)}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bbf7d0}
.b-err{background:var(--err-bg);color:var(--err);border:1px solid #fecaca}
.b-mut{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}
.b-warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:#f8fafc}
.thumb-none{width:56px;height:42px;border-radius:6px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:10px;background:#f8fafc}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue-dark);border:1px solid var(--blue-border);border-radius:999px;padding:1px 8px;font-size:12px;margin:1px}
.tag button{border:none;background:none;color:var(--blue-dark);cursor:pointer;font-size:12px;line-height:1;padding:0 2px}
input,select{font:inherit;border:1px solid var(--border);border-radius:7px;padding:6px 10px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--blue-border);border-color:var(--blue)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters input[type=text]{width:220px}
.pager{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.pager .pager-info{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.form-row input[type=text]{flex:1;min-width:140px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13px}
.detail-grid .k{color:var(--muted);font-size:12px}
.detail-grid .v{word-break:break-all}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:50}
.modal{background:#fff;border-radius:12px;max-width:720px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.modal-head h3{font-size:15px}
.modal-body{padding:18px 20px}
.progress-track{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:10px 0 6px}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:999px;transition:width .4s ease}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
.evlog{max-height:220px;overflow:auto;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.evlog div{padding:2px 0;color:var(--text)}
.evlog .ev-time{color:#94a3b8;margin-right:8px}
.evlog .ev-err{color:var(--err)}
.evlog .ev-ok{color:var(--ok)}
.hidden{display:none}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:#fff;border-left:4px solid var(--blue);border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,.15);padding:10px 14px;font-size:13px;min-width:220px;max-width:360px;animation:slide .2s ease}
.toast.err{border-left-color:var(--err)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
a.link{color:var(--blue);text-decoration:none;cursor:pointer}
a.link:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5L11 18"/></svg></div>
    <div><h1>数据资产管理</h1><p>llava-instruct asset manager</p></div>
  </div>
  <div class="top-actions">
    <button class="btn-g" onclick="refreshAll()">刷新</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav>
      <button class="nav-item" data-page="sources" onclick="showPage('sources')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        数据源<span class="badge-count" id="badgeSources"></span>
      </button>
      <button class="nav-item" data-page="assets" onclick="showPage('assets')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5L11 18"/></svg>
        资产<span class="badge-count" id="badgeAssets"></span>
      </button>
      <button class="nav-item" data-page="snapshots" onclick="showPage('snapshots')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l3-4h12l3 4"/><path d="M5 7v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7"/><path d="M9 11h6"/></svg>
        集合快照<span class="badge-count" id="badgeSnapshots"></span>
      </button>
      <button class="nav-item" data-page="downloads" onclick="showPage('downloads')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="m8.5 12.5 3.5 3.5 3.5-3.5"/></svg>
        下载记录
      </button>
    </nav>
    <div class="sidebar-foot" id="backendInfo">后端：-</div>
  </aside>

  <main class="content">
    <!-- ============================== 数据源 ============================== -->
    <section class="page active" id="page-sources">
      <div class="card">
        <div class="card-head"><h2>数据源</h2><span class="hint">定义资源的元信息与下载源，点击同步将下载并登记资产（当前仅支持 huggingface）</span></div>
        <div class="card-body">
          <table><thead><tr><th>名称</th><th>类型</th><th>process</th><th>repo_id / 路径</th><th>许可</th><th>状态</th><th style="width:230px">操作</th></tr></thead>
          <tbody id="sourcesBody"><tr><td colspan="7" class="empty">暂无数据源</td></tr></tbody></table>
          <div class="form-row">
            <input id="srcName" type="text" placeholder="名称（必填）">
            <select id="srcKind"><option value="huggingface">huggingface</option></select>
            <select id="srcProcess"><option value="file">process: file</option><option value="parquet">process: parquet</option></select>
            <input id="srcRepo" type="text" placeholder="repo_id（如 lmms-lab-encoder/COCO-Caption）" style="flex:2">
            <button class="btn-p" onclick="addSource()">添加数据源</button>
          </div>
        </div>
      </div>
    </section>

    <!-- =============================== 资产 =============================== -->
    <section class="page" id="page-assets">
      <div class="card">
        <div class="card-head"><h2>资产</h2><span class="hint" id="assetCount">-</span></div>
        <div class="card-body">
          <div class="filters">
            <select id="fType"><option value="">全部类型</option><option>general_image</option><option>document_image</option><option>chart_image</option><option>interleaved_pair</option></select>
            <select id="fStatus"><option value="">全部状态</option><option value="ready">ready</option><option value="pending">pending</option><option value="failed">failed</option></select>
            <input id="fTag" type="text" placeholder="标签过滤，如 task=chart">
            <select id="fSource"><option value="">全部数据源</option></select>
            <input id="fQ" type="text" placeholder="搜索名称 / ID（服务端）">
            <button class="btn-g" onclick="loadAssets(true)">筛选</button>
          </div>
          <table><thead><tr><th>预览</th><th>名称</th><th>类型</th><th>状态</th><th>大小</th><th>标签</th><th style="width:200px">操作</th></tr></thead>
          <tbody id="assetsBody"><tr><td colspan="7" class="empty">暂无资产，请先同步或导入数据源</td></tr></tbody></table>
          <div class="pager">
            <button class="btn-g btn-s" id="btnPrev" onclick="prevPage()" disabled>上一页</button>
            <span class="pager-info" id="pagerInfo">第 1 页</span>
            <button class="btn-g btn-s" id="btnNext" onclick="nextPage()" disabled>下一页</button>
            <span class="pager-info" id="assetCount"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================= 集合快照 ============================= -->
    <section class="page" id="page-snapshots">
      <div class="card">
        <div class="card-head"><h2>集合快照</h2><span class="hint">固定当前资产清单，保证可复现</span></div>
        <div class="card-body">
          <div class="form-row">
            <input id="snapName" type="text" placeholder="快照名称（留空自动生成）">
            <button class="btn-p" onclick="createSnapshot()">创建快照</button>
          </div>
          <div style="margin-top:14px"><table><thead><tr><th>名称</th><th>资产数</th><th>manifest sha1</th><th>创建时间</th></tr></thead>
          <tbody id="snapBody"><tr><td colspan="4" class="empty">暂无快照</td></tr></tbody></table></div>
        </div>
      </div>
    </section>

    <!-- ============================= 下载记录 ============================= -->
    <section class="page" id="page-downloads">
      <div class="card">
        <div class="card-head"><h2>下载记录</h2><span class="hint">最近 50 条同步任务</span></div>
        <div class="card-body">
          <table><thead><tr><th>状态</th><th>下载器</th><th>attempts</th><th>错误</th><th>时间</th></tr></thead>
          <tbody id="dlBody"><tr><td colspan="5" class="empty">暂无下载记录</td></tr></tbody></table>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">资产详情</h3><button class="btn-g" onclick="closeModal()">关闭</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="syncModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head"><h3>同步进度 <span id="syncRunBadge"></span></h3><button class="btn-g btn-w btn-s" id="syncPauseBtn" onclick="togglePauseSync()" style="display:none">暂停</button><button class="btn-g" id="syncCloseBtn" onclick="closeSyncModal()">关闭</button></div>
    <div class="modal-body">
      <div class="progress-track"><div class="progress-bar" id="syncBar" style="width:0%"></div></div>
      <div class="progress-info">
        <span id="syncStage">-</span>
        <span id="syncPct">0%</span>
        <span id="syncCounts">0/0</span>
      </div>
      <div class="mono" style="margin-bottom:10px" id="syncFile">-</div>
      <div class="evlog" id="syncEvents"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s);
const PAGE_LOADERS={sources:loadSources,assets:loadAssets,snapshots:loadSnapshots,downloads:loadDownloads};
let currentPage='sources';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=j.detail||msg;}catch(e){msg=(await r.text()).slice(0,200)||msg;}
    throw new Error(msg);
  }
  return r.status===204?null:r.json();
}
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast'+(type==='err'?' err':'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3500);}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function fmtSize(n){if(!n)return '-';if(n<1024)return n+'B';if(n<1048576)return (n/1024).toFixed(1)+'KB';return (n/1048576).toFixed(1)+'MB';}
function statusBadge(s){const m={ready:['b-ok','已就绪'],failed:['b-err','失败'],pending:['b-mut','等待'],downloading:['b-warn','下载中']};const[k,l]=m[s]||['b-mut',s];return `<span class="badge ${k}">${esc(l)}</span>`;}
function typeBadge(t){const m={general_image:'b-t',document_image:'b-warn',chart_image:'b-ok',interleaved_pair:'b-mut'};return `<span class="badge ${m[t]||'b-mut'}">${esc(t||'-')}</span>`;}
function tagChips(tags,assetId){return (tags||[]).map(([g,n])=>`<span class="tag">${esc(g)}=${esc(n)}${assetId?`<button title="删除标签" onclick="untagAsset('${assetId}','${esc(n)}')">×</button>`:''}</span>`).join('')||'<span class="mono">-</span>';}
function thumb(a){return a.object_key?`<img class="thumb" src="/api/assets/${a.id}/preview" onerror="this.parentNode.innerHTML='<div class=thumb-none>无图</div>'">`:'<div class="thumb-none">无图</div>';}

// ------------------------------------------------------------ 页面切换
function showPage(name){
  currentPage=name;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));
  PAGE_LOADERS[name]();
}
function refreshAll(){
  loadInfo();
  PAGE_LOADERS[currentPage]();
  toast('已刷新');
}

// ---------------------------------------------------------------- 概览信息
async function loadInfo(){
  try{
    const info=await api('/api/info');
    $('#backendInfo').innerHTML=`后端：${info.backend==='s3'?`RustFS/S3<br><span class="chip">${esc(info.bucket)}</span>`:'本地存储'}<br><span style="font-size:11px">库：${esc(info.data_dir)}</span>`;
    $('#badgeSources').textContent=info.source_count;
    $('#badgeAssets').textContent=info.asset_count;
    $('#badgeSnapshots').textContent=info.snapshot_count;
  }catch(e){toast('加载统计失败: '+e.message,'err');}
}

// ---------------------------------------------------------------- 数据源页
async function loadSources(){
  try{
    const list=await api('/api/sources');
    const sel=$('#fSource');const cur=sel.value;
    sel.innerHTML='<option value="">全部数据源</option>'+list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    if(cur)sel.value=cur;
    if(!list.length){$('#sourcesBody').innerHTML='<tr><td colspan="7" class="empty">暂无数据源</td></tr>';return;}
    $('#sourcesBody').innerHTML=list.map(s=>`<tr>
      <td>${esc(s.name)}</td><td><span class="badge b-t">${esc(s.kind)}</span></td>
      <td><span class="badge ${(s.params||{}).process==='parquet'?'b-warn':'b-mut'}">${esc((s.params||{}).process||'file')}</span></td>
      <td class="mono" style="word-break:break-all">${esc((s.params||{}).repo_id||s.url||'-')}</td>
      <td>${esc(s.license||'-')}</td>
      <td>${s.enabled?'<span class="badge b-ok">启用</span>':'<span class="badge b-mut">停用</span>'}</td>
      <td><button class="btn-g btn-s" onclick="syncSource('${s.id}')">同步</button>
          ${s.running_run_id?`<button class="btn-g btn-s" style="border-color:#f59e0b;color:#b45309" onclick="openSyncPanel('${s.running_run_id}')">● 查看进度</button>`:''}
          <button class="btn-d btn-s" onclick="rmSource('${s.id}')">删除</button></td></tr>`).join('');
  }catch(e){toast('加载数据源失败: '+e.message,'err');}
}

async function addSource(){
  const name=$('#srcName').value.trim();
  const repo=$('#srcRepo').value.trim();
  if(!name||!repo)return toast('请填写数据源名称和 repo_id','err');
  try{
    const params={repo_id:repo,process:$('#srcProcess').value};
    await api('/api/sources',{method:'POST',body:JSON.stringify({name,kind:'huggingface',params})});
    toast('数据源已添加');$('#srcName').value='';$('#srcRepo').value='';
    loadInfo();loadSources();
  }catch(e){toast('添加失败: '+e.message,'err');}
}

async function syncSource(id){
  let runId;
  try{
    const r=await api(`/api/sources/${id}/sync`,{method:'POST'});
    runId=r.run_id;
  }catch(e){
    const m=(e.message||'').match(/run=([\w]+)/);
    if(m){openSyncPanel(m[1]);return;}   // 已在同步中：直接打开已有进度
    toast('同步失败: '+e.message,'err');return;
  }
  openSyncPanel(runId);
}

// ------------------------------------------------------------ 同步进度面板
const STAGE_LABELS={resolve:'解析文件清单',download:'下载到暂存区',process:'数据格式解析',persist:'持久化到存储',control:'控制',done:'完成',error:'失败'};
let syncPollTimer=null,syncLastEventId=0,syncRunId=null,syncStatus='';

function openSyncPanel(runId){
  syncRunId=runId;syncLastEventId=0;
  $('#syncBar').style.width='0%';$('#syncPct').textContent='0%';
  $('#syncEvents').innerHTML='';
  $('#syncModal').classList.remove('hidden');
  pollSync();
}
function closeSyncModal(){
  clearTimeout(syncPollTimer);
  $('#syncModal').classList.add('hidden');
  loadSources();
}
async function pollSync(){
  if(!syncRunId)return;
  try{
    const run=await api('/api/sync/'+syncRunId);
    const pct=Math.round(run.progress||0);
    $('#syncBar').style.width=pct+'%';
    $('#syncPct').textContent=pct+'%';
    $('#syncStage').textContent=STAGE_LABELS[run.current_stage]||run.current_stage||'-';
    $('#syncCounts').textContent=`完成 ${run.done_files}/${run.total_files}${run.failed_files?`，失败 ${run.failed_files}`:''}`;
    $('#syncFile').textContent=run.current_file?`当前文件：${run.current_file}`:'-';
    $('#syncRunBadge').innerHTML=run.status==='running'?'<span class="badge b-warn">运行中</span>'
      :(run.status==='paused'?'<span class="badge b-mut">已暂停</span>'
        :(run.status==='done'?'<span class="badge b-ok">已完成</span>':'<span class="badge b-err">失败</span>'));
    syncStatus=run.status;
    const ctrl=$('#syncPauseBtn');
    if(run.status==='running'||run.status==='paused'){
      ctrl.style.display='';
      ctrl.textContent=run.status==='paused'?'继续':'暂停';
    }else{
      ctrl.style.display='none';
    }
    if(run.error)$('#syncFile').textContent='错误：'+run.error;

    const events=await api(`/api/sync/${syncRunId}/events?after=${syncLastEventId}`);
    if(events.length){
      syncLastEventId=events[events.length-1].id;
      const log=$('#syncEvents');
      for(const ev of events){
        const div=document.createElement('div');
        div.className=ev.level==='error'?'ev-err':(ev.stage==='done'?'ev-ok':'');
        div.innerHTML=`<span class="ev-time">${esc(ev.ts.slice(11,19))}</span>[${esc(ev.stage||'-')}] ${ev.remote?esc(ev.remote)+' ' : ''}${esc(ev.message)}`;
        log.appendChild(div);
      }
      log.scrollTop=log.scrollHeight;
    }
    if(run.status==='running'){
      syncPollTimer=setTimeout(pollSync,1000);
    }else{
      loadSources();  // 同步结束：刷新操作栏（移除"查看进度"）
      if(run.status==='failed')toast('同步失败: '+run.error,'err');
    }
  }catch(e){toast('获取同步进度失败: '+e.message,'err');}
}

async function togglePauseSync(){
  if(!syncRunId)return;
  const action=syncStatus==='paused'?'resume':'pause';
  try{
    await api(`/api/sync/${syncRunId}/${action}`,{method:'POST'});
    pollSync();
  }catch(e){toast('操作失败: '+e.message,'err');}
}

async function rmSource(id){
  if(!confirm('删除数据源将级联删除其下资产元数据，确认？'))return;
  try{await api(`/api/sources/${id}`,{method:'DELETE'});toast('数据源已删除');loadInfo();loadSources();}
  catch(e){toast('删除失败: '+e.message,'err');}
}

// ---------------------------------------------------------------- 资产页
let assetsCursor=null, assetsPrevCursors=[], assetsPage=1;

async function loadAssets(reset=false){
  if(reset){assetsCursor=null;assetsPrevCursors=[];assetsPage=1;}
  const q=new URLSearchParams();
  if($('#fType').value)q.set('type',$('#fType').value);
  if($('#fStatus').value)q.set('status',$('#fStatus').value);
  if($('#fTag').value.trim())q.set('tag',$('#fTag').value.trim());
  if($('#fSource').value)q.set('source',$('#fSource').value);
  if($('#fQ').value.trim())q.set('q',$('#fQ').value.trim());
  if(assetsCursor)q.set('cursor',assetsCursor);
  q.set('page_size','50');
  try{
    const data=await api('/api/assets?'+q);
    const list=data.items;
    $('#assetCount').textContent=`本页 ${list.length} 条`;
    $('#pagerInfo').textContent=`第 ${assetsPage} 页`;
    $('#btnPrev').disabled=assetsPage===1;
    $('#btnNext').disabled=!data.next_cursor;
    $('#btnNext').dataset.cursor=data.next_cursor||'';
    if(!list.length){$('#assetsBody').innerHTML='<tr><td colspan="7" class="empty">没有符合条件的资产</td></tr>';return;}
    $('#assetsBody').innerHTML=list.map(a=>`<tr>
      <td>${thumb(a)}</td>
      <td><a class="link" onclick="openDetail('${a.id}')">${esc(a.name)}</a><br><span class="mono">${esc(a.id)}</span></td>
      <td>${typeBadge(a.asset_type)}</td><td>${statusBadge(a.status)}</td>
      <td>${fmtSize(a.size)}</td>
      <td>${tagChips(a.tags,'${a.id}')}</td>
      <td>
        <input id="tg${a.id}" placeholder="标签名" style="width:86px;padding:3px 6px">
        <button class="btn-g btn-s" onclick="tagAsset('${a.id}')">打标</button>
        <button class="btn-d btn-s" onclick="rmAsset('${a.id}')">删除</button>
      </td></tr>`).join('');
  }catch(e){toast('加载资产失败: '+e.message,'err');}
}

function nextPage(){
  if($('#btnNext').disabled)return;
  assetsPrevCursors.push(assetsCursor);
  assetsCursor=$('#btnNext').dataset.cursor||null;
  assetsPage++;
  loadAssets();
}
function prevPage(){
  if(assetsPage===1)return;
  assetsCursor=assetsPrevCursors.pop()||null;
  assetsPage--;
  loadAssets();
}

async function tagAsset(id){
  const name=$('#tg'+id).value.trim();if(!name)return;
  try{await api(`/api/assets/${id}/tags`,{method:'POST',body:JSON.stringify({name})});toast('已打标');loadAssets();}
  catch(e){toast('打标失败: '+e.message,'err');}
}
async function untagAsset(id,name){
  try{await api(`/api/assets/${id}/tags/${encodeURIComponent(name)}`,{method:'DELETE'});toast('已删除标签');loadAssets();}
  catch(e){toast('删除标签失败: '+e.message,'err');}
}
async function rmAsset(id){
  if(!confirm('确认删除该资产？'))return;
  try{await api(`/api/assets/${id}`,{method:'DELETE'});toast('资产已删除');loadInfo();loadAssets();}
  catch(e){toast('删除失败: '+e.message,'err');}
}

async function openDetail(id){
  try{
    const a=await api('/api/assets/'+id);
    const cur=a.current_version;
    $('#modalTitle').textContent=`资产详情 · ${a.name}`;
    $('#modalBody').innerHTML=`
      <div class="detail-grid" style="margin-bottom:16px">
        <div><div class="k">ID</div><div class="v mono">${esc(a.id)}</div></div>
        <div><div class="k">数据源</div><div class="v mono">${esc(a.source_id)}</div></div>
        <div><div class="k">类型 / 状态</div><div class="v">${typeBadge(a.asset_type)} ${statusBadge(a.status)}</div></div>
        <div><div class="k">尺寸</div><div class="v">${a.width?`${a.width} × ${a.height}`:'-'}</div></div>
        <div><div class="k">大小</div><div class="v">${fmtSize(a.size)}</div></div>
        <div><div class="k">对象键</div><div class="v mono">${esc(a.object_key||'-')}</div></div>
        <div><div class="k">sha256</div><div class="v mono">${esc(a.sha256||'-')}</div></div>
        <div><div class="k">创建 / 更新</div><div class="v mono">${esc(a.created_at)}<br>${esc(a.updated_at)}</div></div>
        <div><div class="k">标签</div><div class="v">${tagChips(a.tags,'${a.id}')}</div></div>
      </div>
      <h4 style="font-size:13px;margin-bottom:8px">版本历史（当前 v${cur}）</h4>
      <table><thead><tr><th>版本</th><th>sha256</th><th>变更说明</th><th>时间</th><th></th></tr></thead>
      <tbody>${(a.versions||[]).map(v=>`<tr>
        <td>v${v.version}${v.version===cur?' <span class="badge b-ok">当前</span>':''}</td>
        <td class="mono">${esc(v.sha256.slice(0,16))}…</td><td>${esc(v.change_note||'-')}</td>
        <td class="mono">${esc(v.created_at)}</td>
        <td>${v.version!==cur?`<button class="btn-g btn-s" onclick="rollbackAsset('${a.id}',${v.version})">回滚</button>`:''}</td></tr>`).join('')}
      </tbody></table>`;
    $('#modal').classList.remove('hidden');
  }catch(e){toast('加载详情失败: '+e.message,'err');}
}
async function rollbackAsset(id,v){
  if(!confirm(`回滚到 v${v}？`))return;
  try{await api(`/api/assets/${id}/rollback`,{method:'POST',body:JSON.stringify({version:v})});toast('已回滚');closeModal();loadAssets();}
  catch(e){toast('回滚失败: '+e.message,'err');}
}
function closeModal(){$('#modal').classList.add('hidden');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#syncModal').addEventListener('click',e=>{if(e.target.id==='syncModal')closeSyncModal();});

// -------------------------------------------------------------- 快照页
async function loadSnapshots(){
  try{
    const list=await api('/api/snapshots');
    if(!list.length){$('#snapBody').innerHTML='<tr><td colspan="4" class="empty">暂无快照</td></tr>';return;}
    $('#snapBody').innerHTML=list.map(s=>`<tr><td>${esc(s.id)}</td><td>${s.asset_count}</td>
      <td class="mono">${esc(s.manifest_sha1.slice(0,16))}…</td><td class="mono">${esc(s.created_at)}</td></tr>`).join('');
  }catch(e){toast('加载快照失败: '+e.message,'err');}
}
async function createSnapshot(){
  try{
    const s=await api('/api/snapshots',{method:'POST',body:JSON.stringify({name:$('#snapName').value.trim()})});
    toast(`快照已创建：${s.id}（${s.asset_count} 资产）`);$('#snapName').value='';loadSnapshots();loadInfo();
  }catch(e){toast('创建快照失败: '+e.message,'err');}
}

// ------------------------------------------------------------ 下载记录页
async function loadDownloads(){
  try{
    const list=await api('/api/downloads?limit=50');
    if(!list.length){$('#dlBody').innerHTML='<tr><td colspan="5" class="empty">暂无下载记录</td></tr>';return;}
    $('#dlBody').innerHTML=list.map(d=>`<tr>
      <td>${statusBadge(d.status)}</td><td><span class="badge b-t">${esc(d.downloader)}</span></td>
      <td>${d.attempts}</td><td class="mono" style="word-break:break-all">${esc(d.error||'-')}</td>
      <td class="mono">${esc(d.finished_at||d.started_at)}</td></tr>`).join('');
  }catch(e){toast('加载下载记录失败: '+e.message,'err');}
}

showPage('sources');
loadInfo();
</script>
