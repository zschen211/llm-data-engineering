# RustFS (S3-compatible object storage) for the asset asset layer.
# Usage: docker compose up -d
#   S3 API  : http://localhost:9000  (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY)
#   Console : http://localhost:9001  (rustfsadmin / rustfsadmin)
#
# Image mirrors: Docker Hub (registry-1.docker.io) may be unreachable in some
# regions; default to the DaoCloud mirror. Override with:
#   RUSTFS_IMAGE=rustfs/rustfs:latest docker compose up -d
services:
  rustfs:
    image: ${RUSTFS_IMAGE:-docker.m.daocloud.io/rustfs/rustfs:latest}
    container_name: rustfs-server
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}   # CHANGEME for production
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}   # CHANGEME for production
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
      # single-machine dev: the four named volumes share one physical disk,
      # so bypass the distinct-disk check (local testing / CI only)
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  volume-permission-helper:
    image: ${ALPINE_IMAGE:-docker.m.daocloud.io/library/alpine:latest}
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
      - rustfs_logs:/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs &&
        echo 'Volume permissions fixed' && exit 0
      "
    restart: "no"

  # --- Observability stack: scrape the app / metrics endpoints, the Ray
  # dashboard (port 8265) and host metrics; visualize in Grafana (port 3000).
  # Usage: docker compose up -d prometheus grafana node-exporter
  #   Grafana : http://localhost:3000  (admin / $GRAFANA_ADMIN_PASSWORD, default admin)
  #   Prometheus : http://localhost:9090
  # Prometheus runs on the host network because the Ray cluster lives inside
  # the uvicorn process: only the host netns can reach ports 8000/8265.
  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/prom/prometheus:latest}
    container_name: obs-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-docker.m.daocloud.io/grafana/grafana:latest}
    container_name: obs-grafana
    # Host network: the container hits Prometheus at localhost:9090, which
    # a bridge network cannot reach (host firewall drops host-gateway hops
    # for container-originated traffic). Datasource URL: http://localhost:9090.
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-docker.m.daocloud.io/prom/node-exporter:latest}
    container_name: obs-node-exporter
    network_mode: host
    restart: unless-stopped

  # Per-process CPU/memory of the host (uvicorn / ray / rustfs / obs stack).
  # Groups by process name per infra/process-exporter/process-exporter.yml;
  # scraped by Prometheus at :9256 (see infra/docs/contract.md).
  process-exporter:
    image: ${PROCESS_EXPORTER_IMAGE:-hub.rat.dev/ncabatoff/process-exporter:latest}
    container_name: obs-process-exporter
    network_mode: host
    command:
      - -config.path=/etc/process-exporter/process-exporter.yml
      - -procfs=/host/proc
    volumes:
      - ./process-exporter/process-exporter.yml:/etc/process-exporter/process-exporter.yml:ro
      - /proc:/host/proc:ro
    restart: unless-stopped

volumes:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
  prometheus_data:
  grafana_data:
