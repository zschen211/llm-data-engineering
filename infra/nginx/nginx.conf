# Production gateway: serves the frontend build and splits /api between
# asset-management (:8000) and data-factory (:8001) on a single origin.
# Dev equivalent: frontend/vite.config.ts proxy (same path split).
# Contract: infra/docs/contract.md.

upstream asset_api {
    server 127.0.0.1:8000;
}

upstream factory_api {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;  # mount frontend/dist/ here
    index index.html;

    # asset-management: the asset-domain resources
    location ~ ^/api/(assets|sources|snapshots|sync|downloads|cluster|info|backup)(/|$) {
        proxy_pass http://asset_api;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # data-factory: everything else under /api
    location /api/ {
        proxy_pass http://factory_api;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # SPA fallback (hash routing; this is only for deep links)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
