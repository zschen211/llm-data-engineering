global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # asset-management self-instrumentation: process gauges (psutil), HTTP
  # counters, Ray cluster/raylet/worker gauges and task counters.
  - job_name: asset-management
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]

  # data-factory self-instrumentation: HTTP counters (metrics prefix asset_).
  - job_name: data-factory
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8001"]

  # Ray's native metrics: raylet/GCS/object-store/worker metrics served by
  # the metrics agent. Port is pinned via ASSET_RAY_METRICS_PORT (default
  # 8080) in ClusterManager — the dashboard port (8265) does not serve
  # /metrics in Ray >= 2.56.
  - job_name: ray-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8080"]

  # Host metrics (CPU/mem/disk of the machine running the pipelines).
  - job_name: node-exporter
    static_configs:
      - targets: ["localhost:9100"]

# TODO: alerting rules + alertmanager targets go here once needed.
